stages:
  - test

backend:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip/
  script:
    - pip install --require-hashes -r backend/requirements.lock.txt
    - cd backend
    - alembic upgrade head
    - python -m app.seed
    - pytest -q

frontend:
  stage: test
  image: node:22-bookworm
  script:
    - cd frontend
    - npm ci --cache ../.cache/npm
    - npm test -- --run
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days

postgres-smoke:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: frip
    POSTGRES_DB: frip
    POSTGRES_PASSWORD: ci-synthetic-only
    FRIP_DATABASE_URL: postgresql+psycopg://frip:ci-synthetic-only@postgres:5432/frip
    FRIP_MODE: synthetic
  script:
    - pip install --require-hashes -r backend/requirements.lock.txt
    - cd backend
    - |
      python - <<'PY'
      import os, time, psycopg
      url = os.environ['FRIP_DATABASE_URL'].replace('postgresql+psycopg:', 'postgresql:')
      for attempt in range(30):
          try:
              psycopg.connect(url, connect_timeout=2).close()
              break
          except psycopg.OperationalError:
              if attempt == 29:
                  raise
              time.sleep(1)
      PY
    - alembic upgrade head
    - alembic upgrade head
    - python -m app.seed
    - python -m app.seed
    - python -c "from fastapi.testclient import TestClient; from app.main import app; client=TestClient(app); assert all(client.get(path).status_code == 200 for path in ['/api/health','/api/fleet','/api/inventory'])"

browser:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3-venv
    - node --version
    - python3 --version
    - python3 -m venv .venv
    - .venv/bin/pip install --require-hashes -r backend/requirements.lock.txt
    - cd frontend
    - npm ci --cache ../.cache/npm
    - npx playwright install --with-deps chromium
  script:
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    expire_in: 7 days
